<html lang="en">

<title>Puff Flap</title>
<style>
  html,body{margin:0;height:100%;background:#1d2a33;overflow:hidden;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

<body>
<canvas id="c" tabindex="0"></canvas>
<script>
(() => {
'use strict';

/* ------------------------------------------------------------------ *
 *  Setup
 * ------------------------------------------------------------------ */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = '"Trebuchet MS","Segoe UI",Roboto,Arial,sans-serif';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mod = (a, n) => ((a % n) + n) % n;

// Physics (fixed timestep => identical on 60 / 144 / 165 Hz monitors)
const STEP = 1 / 120;
const G = 1500, FLAP = -430, MAXV = 720;
const R = 20, HIT = 15;            // bird draw radius / forgiving hit radius
const PW = 72, CAPH = 28;          // pipe width, cap height
const PIPE_SPACING = 260;

// Logical (virtual) resolution. Height is 600 logical px, width adapts to the iframe.
let W = 800, H = 600, S = 1, DPR = 1, groundY = 530;

/* ------------------------------------------------------------------ *
 *  Localization (English + auto language from CrazyGames SDK locale)
 * ------------------------------------------------------------------ */
const T = {
  en:{tap:'Tap, click or press Space to flap',over:'Game Over',score:'Score',best:'Best',again:'Play Again',cont:'Continue (watch ad)',paused:'Paused',resume:'Click to resume',nb:'New best!'},
  es:{tap:'Toca, haz clic o pulsa Espacio para volar',over:'Fin del juego',score:'Puntos',best:'Mejor',again:'Jugar de nuevo',cont:'Continuar (ver anuncio)',paused:'Pausa',resume:'Haz clic para continuar',nb:'¡Nuevo récord!'},
  fr:{tap:'Touchez, cliquez ou appuyez sur Espace pour voler',over:'Partie terminée',score:'Score',best:'Record',again:'Rejouer',cont:'Continuer (voir une pub)',paused:'Pause',resume:'Cliquez pour reprendre',nb:'Nouveau record !'},
  de:{tap:'Tippen, klicken oder Leertaste zum Flattern',over:'Spiel vorbei',score:'Punkte',best:'Rekord',again:'Nochmal spielen',cont:'Weiter (Werbung ansehen)',paused:'Pause',resume:'Klicken zum Fortsetzen',nb:'Neuer Rekord!'},
  pt:{tap:'Toque, clique ou pressione Espaço para voar',over:'Fim de jogo',score:'Pontos',best:'Recorde',again:'Jogar novamente',cont:'Continuar (ver anúncio)',paused:'Pausado',resume:'Clique para continuar',nb:'Novo recorde!'},
  tr:{tap:'Dokun, tıkla veya Boşluk tuşuna bas',over:'Oyun bitti',score:'Skor',best:'En iyi',again:'Tekrar oyna',cont:'Devam et (reklam izle)',paused:'Duraklatıldı',resume:'Devam etmek için tıkla',nb:'Yeni rekor!'},
  ru:{tap:'Нажмите, кликните или Пробел, чтобы взмахнуть',over:'Игра окончена',score:'Счёт',best:'Рекорд',again:'Играть снова',cont:'Продолжить (реклама)',paused:'Пауза',resume:'Нажмите, чтобы продолжить',nb:'Новый рекорд!'}
};
const TX = {
  en:{lb:'Leaderboard',mine:'My scores',world:'World',empty:'No scores yet. Play a round!',close:'Close',loading:'Loading…',fail:'Could not load scores.'},
  es:{lb:'Clasificación',mine:'Mis puntos',world:'Mundial',empty:'Aún no hay puntos. ¡Juega una partida!',close:'Cerrar',loading:'Cargando…',fail:'No se pudieron cargar los puntos.'},
  fr:{lb:'Classement',mine:'Mes scores',world:'Monde',empty:'Aucun score. Lancez une partie !',close:'Fermer',loading:'Chargement…',fail:'Impossible de charger les scores.'},
  de:{lb:'Bestenliste',mine:'Meine Punkte',world:'Welt',empty:'Noch keine Punkte. Spiel eine Runde!',close:'Schließen',loading:'Lädt…',fail:'Punkte konnten nicht geladen werden.'},
  pt:{lb:'Classificação',mine:'Meus pontos',world:'Mundo',empty:'Sem pontos ainda. Jogue uma partida!',close:'Fechar',loading:'Carregando…',fail:'Não foi possível carregar os pontos.'},
  tr:{lb:'Skor tablosu',mine:'Skorlarım',world:'Dünya',empty:'Henüz skor yok. Bir tur oyna!',close:'Kapat',loading:'Yükleniyor…',fail:'Skorlar yüklenemedi.'},
  ru:{lb:'Таблица лидеров',mine:'Мои очки',world:'Мир',empty:'Пока нет очков. Сыграйте раунд!',close:'Закрыть',loading:'Загрузка…',fail:'Не удалось загрузить очки.'}
};
let lang = 'en', t = Object.assign({}, T.en, TX.en);
function setLang(code) {
  const l = String(code || 'en').slice(0, 2).toLowerCase();
  lang = T[l] ? l : 'en';
  t = Object.assign({}, T[lang], TX[lang]);
  document.documentElement.lang = lang;
}

/* ------------------------------------------------------------------ *
 *  CrazyGames SDK helpers (all guarded: game works without SDK too)
 * ------------------------------------------------------------------ */
let sdkReady = false;
const SDK = () => (window.CrazyGames && window.CrazyGames.SDK) || null;

async function initSDK() {
  try {
    if (SDK()) {
      await SDK().init();
      sdkReady = true;
      const si = SDK().user && SDK().user.systemInfo;
      if (si && si.locale) setLang(si.locale);
      else setLang(navigator.language);
      return;
    }
  } catch (e) { sdkReady = false; }
  setLang(navigator.language);
}
let gpOn = false;
function setGameplay(on) {
  if (on === gpOn) return;
  gpOn = on;
  try { if (sdkReady) on ? SDK().game.gameplayStart() : SDK().game.gameplayStop(); } catch (e) {}
}
function store(k, v) {
  try { if (sdkReady && SDK().data) SDK().data.setItem(k, String(v)); else localStorage.setItem(k, String(v)); } catch (e) {}
}
function load(k) {
  try { return (sdkReady && SDK().data) ? SDK().data.getItem(k) : localStorage.getItem(k); } catch (e) { return null; }
}

let adActive = false, busy = false;
function showAd(type, done) {
  const sdk = SDK();
  if (!sdkReady || !sdk || !sdk.ad) { done(false); return; }
  let fin = false;
  const end = ok => { if (fin) return; fin = true; adActive = false; applyVolume(); done(ok); };
  try {
    sdk.ad.requestAd(type, {
      adStarted: () => { adActive = true; applyVolume(); },
      adFinished: () => end(true),
      adError: () => end(false)
    });
  } catch (e) { end(false); }
}

/* ------------------------------------------------------------------ *
 *  Audio (synthesized => no files, consistent levels, tiny download)
 * ------------------------------------------------------------------ */
let actx = null, master = null, muted = false;
function ensureAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain();
    master.connect(actx.destination);
    applyVolume();
  } catch (e) { actx = null; }
}
function applyVolume() { if (master) master.gain.value = (muted || adActive) ? 0 : 0.22; }
function tone(f1, f2, dur, type, vol, delay) {
  if (!actx) return;
  const s = actx.currentTime + (delay || 0);
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f1, s);
  o.frequency.exponentialRampToValueAtTime(f2, s + dur);
  g.gain.setValueAtTime(vol, s);
  g.gain.exponentialRampToValueAtTime(0.001, s + dur);
  o.connect(g); g.connect(master);
  o.start(s); o.stop(s + dur + 0.03);
}
function noise(dur, vol) {
  if (!actx) return;
  const n = (actx.sampleRate * dur) | 0;
  const b = actx.createBuffer(1, n, actx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = actx.createBufferSource(), g = actx.createGain();
  s.buffer = b; g.gain.value = vol;
  s.connect(g); g.connect(master); s.start();
}
const sfx = {
  flap:  () => tone(380, 640, 0.12, 'triangle', 0.6),
  point: () => { tone(880, 880, 0.07, 'square', 0.28); tone(1175, 1175, 0.11, 'square', 0.28, 0.07); },
  star:  () => { tone(1046, 1046, 0.07, 'triangle', 0.5); tone(1568, 1568, 0.07, 'triangle', 0.5, 0.06); tone(2093, 2093, 0.14, 'triangle', 0.5, 0.12); },
  hit:   () => { noise(0.25, 0.6); tone(240, 60, 0.3, 'sawtooth', 0.45); }
};
function toggleMute() {
  muted = !muted; applyVolume(); store('muted', muted ? 1 : 0);
}

/* ------------------------------------------------------------------ *
 *  Game state
 * ------------------------------------------------------------------ */
let state = 'ready';   // ready | play | dying | dead
let paused = false;
let score = 0, best = 0, newBest = false;
let camX = 0, prevCam = 0, bgScroll = 0, nextPipeX = 0, pipeN = 0;
let time = 0, shake = 0, flash = 0, deadT = 0, invuln = 0, hoverY = 270;
let reviveUsed = false, rewardFailed = false, revived = false;
let pipes = [];
// Leaderboard state (player's own top 10, stored via CrazyGames SDK data / localStorage; no backend)
let boardOpen = false, myTop = [], lastRank = -1, lastEntry = null;
const bird = { y: 270, py: 270, vy: 0, wing: 0 };
const particles = [];
const buttons = [];
const birdX = () => clamp(W * 0.28, 100, 300);

const themes = [
  [[79, 184, 232], [191, 233, 247]],   // day
  [[255, 128, 96], [255, 214, 150]],   // sunset
  [[20, 26, 64], [70, 84, 140]]        // night
];
const cur = [[79, 184, 232], [191, 233, 247]];

const clouds = [
  { x: 100, y: 70, s: 1 }, { x: 380, y: 150, s: 1.4 }, { x: 650, y: 60, s: .9 },
  { x: 900, y: 170, s: 1.2 }, { x: 1150, y: 90, s: 1.1 }, { x: 240, y: 270, s: .8 }
];

function pipeBounds(gap) {
  return [gap / 2 + CAPH + 50, groundY - gap / 2 - CAPH - 40];
}
function spawnPipe(wx) {
  const gap = Math.max(145, Math.round(176 - score * 0.8));
  const [lo, hi] = pipeBounds(gap);
  let base = lo + Math.random() * (hi - lo);
  const last = pipes[pipes.length - 1];
  if (last) base = clamp(base, last.base - 150, last.base + 150);   // always reachable
  base = clamp(base, lo, hi);
  pipeN++;
  pipes.push({
    wx, base, gap, gapY: base,
    amp: (score >= 12 && Math.random() < 0.6) ? Math.min(40, (score - 10) * 2) : 0,
    ph: Math.random() * 6, passed: false, star: pipeN % 3 === 0, taken: false
  });
}
function reset() {
  score = 0; pipes = []; pipeN = 0; camX = 0; prevCam = 0;
  nextPipeX = birdX() + 480;
  hoverY = H * 0.45; bird.y = bird.py = hoverY; bird.vy = 0;
  state = 'ready'; newBest = false; reviveUsed = false; rewardFailed = false;
  revived = false; invuln = 0; busy = false; particles.length = 0;
  lastRank = -1; lastEntry = null;
}
function startPlay() { state = 'play'; setGameplay(true); }

function flap() {
  if (adActive || paused) return;
  if (state === 'ready') startPlay();
  if (state === 'play') {
    bird.vy = FLAP; bird.wing = 0; sfx.flap();
    burst(birdX() - 14, bird.y + 8, '#fffdf0', 3, 40, 3);
  }
}
function recordScore(s) {
  lastEntry = null; lastRank = -1;
  if (s <= 0) return;
  const e = { s, d: Date.now() };
  myTop.push(e); myTop.sort((a, b) => b.s - a.s);
  if (myTop.length > 10) myTop.length = 10;
  lastRank = myTop.indexOf(e);
  lastEntry = lastRank >= 0 ? e : null;
  store('top', JSON.stringify(myTop));
}
function openBoard() {
  if (adActive || paused || state === 'play' || state === 'dying') return;
  boardOpen = true;
}
function closeBoard() { boardOpen = false; }
function toggleBoard() { boardOpen ? closeBoard() : openBoard(); }

function die() {
  if (state !== 'play') return;
  state = 'dying'; bird.vy = -220; shake = 0.25; flash = 1;
  sfx.hit();
  burst(birdX(), bird.y, '#ffd84a', 14, 160, 4);
  setGameplay(false);
  if (score > best) { best = score; newBest = true; store('best', best); }
  recordScore(score);
}
function restart() {
  if (busy || state !== 'dead') return;
  busy = true;
  showAd('midgame', () => reset());
}
function revive() {
  if (lastEntry) {            // the run continues, so its interim score must not stay on the board
    const i = myTop.indexOf(lastEntry);
    if (i >= 0) { myTop.splice(i, 1); store('top', JSON.stringify(myTop)); }
    lastEntry = null; lastRank = -1;
  }
  const bx = camX + birdX();
  pipes = pipes.filter(p => p.wx > bx + 220);
  hoverY = pipes[0] ? pipes[0].gapY : H * 0.45;
  bird.y = bird.py = hoverY; bird.vy = 0;
  invuln = 1.6; reviveUsed = true; revived = true;
  state = 'ready'; prevCam = camX; busy = false;
}
function doContinue() {
  if (busy || state !== 'dead') return;
  busy = true;
  showAd('rewarded', ok => { if (ok) revive(); else { rewardFailed = true; busy = false; } });
}
function pause() { if (state === 'play' && !paused) { paused = true; setGameplay(false); } }
function resume() { if (paused) { paused = false; if (state === 'play') setGameplay(true); } }
function togglePause() { paused ? resume() : pause(); }

/* ------------------------------------------------------------------ *
 *  Particles
 * ------------------------------------------------------------------ */
function burst(x, y, color, n, spd, r) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = spd * (0.4 + Math.random() * 0.6);
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.5 + Math.random() * 0.3, max: 0.8, c: color, r });
  }
}

/* ------------------------------------------------------------------ *
 *  Update (fixed step)
 * ------------------------------------------------------------------ */
function hitRect(cx, cy, r, x, y, w, h) {
  const nx = clamp(cx, x, x + w), ny = clamp(cy, y, y + h);
  return (cx - nx) * (cx - nx) + (cy - ny) * (cy - ny) < r * r;
}
function collide(p, bx, by) {
  const top = p.gapY - p.gap / 2, bot = p.gapY + p.gap / 2;
  return hitRect(bx, by, HIT, p.wx, -300, PW, top + 300) ||
         hitRect(bx, by, HIT, p.wx, bot, PW, H) ||
         hitRect(bx, by, HIT, p.wx - 6, top - CAPH, PW + 12, CAPH) ||
         hitRect(bx, by, HIT, p.wx - 6, bot, PW + 12, CAPH);
}
function update(dt) {
  time += dt;
  shake = Math.max(0, shake - dt); flash = Math.max(0, flash - dt * 3);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt;
  }
  const tg = themes[Math.floor(score / 20) % 3], k = Math.min(1, dt * 1.5);
  for (let a = 0; a < 2; a++) for (let c = 0; c < 3; c++) cur[a][c] += (tg[a][c] - cur[a][c]) * k;

  bird.wing += dt * (state === 'play' ? 14 : 8);
  prevCam = camX; bird.py = bird.y;

  if (state === 'ready') {
    bgScroll += 70 * dt;
    bird.y = hoverY + Math.sin(time * 5) * 6; bird.py = bird.y;
    return;
  }
  if (state === 'dying') {
    bird.vy = Math.min(MAXV, bird.vy + G * dt); bird.y += bird.vy * dt;
    if (bird.y + R >= groundY) { bird.y = groundY - R; state = 'dead'; deadT = 0; }
    return;
  }
  if (state === 'dead') { deadT += dt; return; }

  // ---- playing ----
  const speed = 150 + Math.min(score, 40) * 2.5;
  camX += speed * dt; bgScroll += speed * dt;
  bird.vy = Math.min(MAXV, bird.vy + G * dt); bird.y += bird.vy * dt;
  if (bird.y < R) { bird.y = R; bird.vy = Math.max(0, bird.vy); }
  if (invuln > 0) invuln -= dt;

  while (nextPipeX < camX + W + 100) { spawnPipe(nextPipeX); nextPipeX += PIPE_SPACING; }
  const bx = camX + birdX();
  for (const p of pipes) {
    p.ph += dt * 1.7;
    const [lo, hi] = pipeBounds(p.gap);
    p.gapY = clamp(p.base + Math.sin(p.ph) * p.amp, lo, hi);
    if (!p.passed && p.wx + PW < bx - HIT) {
      p.passed = true; score++; sfx.point();
      if (score % 10 === 0) { try { if (sdkReady) SDK().game.happytime(); } catch (e) {} }
    }
    if (p.star && !p.taken && Math.hypot(p.wx + PW / 2 - bx, p.gapY - bird.y) < 30) {
      p.taken = true; score++; sfx.star();
      burst(p.wx + PW / 2 - camX, p.gapY, '#ffe35a', 12, 150, 3);
    }
    if (invuln <= 0 && collide(p, bx, bird.y)) { die(); break; }
  }
  if (state === 'play' && bird.y + R >= groundY) { bird.y = groundY - R; die(); }
  while (pipes.length && pipes[0].wx + PW + 20 < camX - 30) pipes.shift();
}

/* ------------------------------------------------------------------ *
 *  Drawing helpers
 * ------------------------------------------------------------------ */
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function txt(s, x, y, size, fill, stroke, maxW, align) {
  maxW = maxW || (W - 24);
  ctx.font = `800 ${size}px ${FONT}`;
  const w = ctx.measureText(s).width;
  if (w > maxW) { size = Math.floor(size * maxW / w); ctx.font = `800 ${size}px ${FONT}`; }
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  if (stroke) { ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill || '#fff'; ctx.fillText(s, x, y);
}
function star(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q);
  }
  ctx.closePath(); ctx.fillStyle = '#ffd23a'; ctx.fill();
  ctx.lineWidth = 2.5; ctx.strokeStyle = '#9a6200'; ctx.stroke();
}
function btn(x, y, w, h, label, col, fn) {
  rr(x, y + 4, w, h, 14); ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fill();
  rr(x, y, w, h, 14); ctx.fillStyle = col; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = '#2b3a20'; ctx.stroke();
  txt(label, x + w / 2, y + h / 2 + 1, 22, '#fff', '#2b3a20', w - 20);
  buttons.push({ x, y, w, h, fn });
}
function iconBtn(x, y, size, icon, fn) {
  ctx.beginPath(); ctx.arc(x + size / 2, y + size / 2, size / 2, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(20,30,40,.45)'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.stroke();
  icon(x + size / 2, y + size / 2);
  buttons.push({ x: x - 4, y: y - 4, w: size + 8, h: size + 8, fn });
}
function iconMute(cx, cy) {
  ctx.fillStyle = '#fff'; ctx.beginPath();
  ctx.moveTo(cx - 9, cy - 4); ctx.lineTo(cx - 4, cy - 4); ctx.lineTo(cx + 2, cy - 10);
  ctx.lineTo(cx + 2, cy + 10); ctx.lineTo(cx - 4, cy + 4); ctx.lineTo(cx - 9, cy + 4);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  if (muted) {
    ctx.beginPath(); ctx.moveTo(cx + 6, cy - 5); ctx.lineTo(cx + 14, cy + 5);
    ctx.moveTo(cx + 14, cy - 5); ctx.lineTo(cx + 6, cy + 5); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(cx + 3, cy, 6, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx + 3, cy, 11, -0.9, 0.9); ctx.stroke();
  }
}
function iconTrophy(cx, cy) {
  ctx.fillStyle = '#ffd23a'; ctx.strokeStyle = '#ffd23a'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(cx - 8, cy - 9); ctx.lineTo(cx + 8, cy - 9);
  ctx.lineTo(cx + 5, cy + 3); ctx.lineTo(cx - 5, cy + 3); ctx.closePath(); ctx.fill();
  ctx.fillRect(cx - 1.5, cy + 3, 3, 5); ctx.fillRect(cx - 6, cy + 8, 12, 3);
  ctx.beginPath(); ctx.arc(cx - 9, cy - 4, 4, Math.PI * 0.5, Math.PI * 1.5); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx + 9, cy - 4, 4, -Math.PI / 2, Math.PI / 2); ctx.stroke();
}
function fmtDate(d) {
  try { return new Date(d).toLocaleDateString(lang, { day: 'numeric', month: 'short' }); } catch (e) { return ''; }
}
function drawBoard() {
  ctx.fillStyle = 'rgba(10,20,30,.62)'; ctx.fillRect(0, 0, W, H);
  const w = Math.min(340, W - 20), h = 460, x0 = W / 2 - w / 2, y0 = H / 2 - h / 2;
  rr(x0, y0, w, h, 20); ctx.fillStyle = '#fff7e0'; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = '#7a4a0a'; ctx.stroke();
  txt(t.lb, W / 2, y0 + 36, 32, '#fff', '#7a4a0a', w - 30);
  txt(t.mine, W / 2, y0 + 78, 20, '#7a4a0a', null, w - 30);
  const list = myTop.map((e, i) => ({ n: fmtDate(e.d), s: e.s, hl: i === lastRank }));
  if (!list.length) txt(t.empty, W / 2, y0 + 200, 20, '#7a4a0a', null, w - 40);
  const medal = ['#e0a100', '#8e9aa3', '#b0652b'];
  list.forEach((r, i) => {
    const ry = y0 + 124 + i * 26;
    if (r.hl) { rr(x0 + 14, ry - 12, w - 28, 24, 8); ctx.fillStyle = '#ffe9a8'; ctx.fill(); }
    txt(String(i + 1), x0 + 32, ry, 18, i < 3 ? medal[i] : '#7a4a0a', null, 30);
    txt(r.n, x0 + 58, ry, 18, '#7a4a0a', null, w - 140, 'left');
    txt(String(r.s), x0 + w - 26, ry, 20, '#7a4a0a', null, 60, 'right');
  });
  btn(W / 2 - 90, y0 + h - 60, 180, 44, t.close, '#4cae2a', closeBoard);
}
function iconPause(cx, cy) {
  ctx.fillStyle = '#fff';
  ctx.fillRect(cx - 7, cy - 8, 5, 16); ctx.fillRect(cx + 2, cy - 8, 5, 16);
}

/* ------------------------------------------------------------------ *
 *  Scene drawing
 * ------------------------------------------------------------------ */
function drawCloud(x, y, s) {
  const u = 6 * s, rows = [[3, 5], [2, 7], [1, 9], [0, 11], [0, 11]];
  rows.forEach((r, i) => {
    ctx.fillStyle = i === 4 ? '#a4dcf0' : '#fdfde8';
    ctx.fillRect(x + r[0] * u, y + i * u, r[1] * u, u + 0.5);
  });
}
function drawBushes() {
  ctx.fillStyle = '#58b83c'; ctx.strokeStyle = '#2f7a2a'; ctx.lineWidth = 3;
  const off = mod(bgScroll * 0.4, 80);
  for (let x = -off - 80; x < W + 80; x += 80) {
    for (const [dx, r] of [[10, 26], [40, 36], [70, 26]]) {
      ctx.beginPath(); ctx.arc(x + dx, groundY, r, Math.PI, 0); ctx.fill(); ctx.stroke();
    }
  }
}
function drawGround() {
  ctx.fillStyle = '#d8a35c'; ctx.fillRect(-10, groundY + 16, W + 20, H - groundY);
  ctx.fillStyle = '#c28a45';
  const off = mod(bgScroll, 32);
  for (let x = -off - 32; x < W + 32; x += 32) {
    ctx.beginPath(); ctx.moveTo(x, groundY + 16); ctx.lineTo(x + 16, groundY + 16);
    ctx.lineTo(x + 4, H + 4); ctx.lineTo(x - 12, H + 4); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = '#86d93b'; ctx.fillRect(-10, groundY, W + 20, 16);
  ctx.fillStyle = '#6fc02d';
  for (let x = -off - 32; x < W + 32; x += 16) ctx.fillRect(x, groundY + 5, 8, 6);
  ctx.fillStyle = '#3f8a1c'; ctx.fillRect(-10, groundY - 1, W + 20, 3); ctx.fillRect(-10, groundY + 15, W + 20, 3);
}
function seg(x, y, w, h) {
  ctx.fillStyle = '#5fc22b'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#a6ec63'; ctx.fillRect(x + 7, y, 8, h);
  ctx.fillStyle = '#3f9a1c'; ctx.fillRect(x + w - 15, y, 10, h);
  ctx.lineWidth = 3; ctx.strokeStyle = '#2b5a12'; ctx.strokeRect(x, y, w, h);
}
function drawPipe(sx, gapY, gap) {
  const top = gapY - gap / 2, bot = gapY + gap / 2;
  seg(sx, -10, PW, top - CAPH + 10);
  seg(sx - 6, top - CAPH, PW + 12, CAPH);
  seg(sx, bot + CAPH, PW, H);
  seg(sx - 6, bot, PW + 12, CAPH);
}
function drawBird(x, y, vy) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(clamp(vy * 0.0016, -0.45, 1.1));
  if (invuln > 0 && Math.floor(time * 12) % 2) ctx.globalAlpha = 0.45;
  ctx.lineWidth = 3; ctx.strokeStyle = '#6b3d0c';
  ctx.fillStyle = '#ffc928'; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff4c9'; ctx.beginPath(); ctx.ellipse(2, 8, 12, 8, 0, 0, Math.PI); ctx.fill();
  ctx.save(); ctx.translate(-8, 3); ctx.rotate(Math.sin(bird.wing) * 0.5);
  ctx.fillStyle = '#ffdf5e'; ctx.beginPath(); ctx.ellipse(-4, 0, 11, 7, -0.3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(8, -6, 6.5, 0, Math.PI * 2); ctx.fill(); ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = '#2a1a0a'; ctx.beginPath(); ctx.arc(10, -6, 3, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 3; ctx.fillStyle = '#ff6b22';
  ctx.beginPath(); ctx.ellipse(19, 4, 9, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,120,150,.7)'; ctx.beginPath(); ctx.arc(3, 6, 4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function render(alpha) {
  ctx.setTransform(DPR * S, 0, 0, DPR * S, 0, 0);
  buttons.length = 0;
  const cam = prevCam + (camX - prevCam) * alpha;
  const by = bird.py + (bird.y - bird.py) * alpha;
  const bx = birdX();

  ctx.save();
  if (shake > 0) { const m = 8 * shake / 0.25; ctx.translate((Math.random() - .5) * m, (Math.random() - .5) * m); }

  // sky
  const g = ctx.createLinearGradient(0, 0, 0, groundY);
  g.addColorStop(0, `rgb(${cur[0].map(Math.round)})`); g.addColorStop(1, `rgb(${cur[1].map(Math.round)})`);
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);

  // clouds
  const LW = Math.max(W + 400, 1300);
  for (const c of clouds) drawCloud(mod(c.x - bgScroll * 0.12 * c.s, LW) - 200, c.y, c.s);
  drawBushes();

  // pipes + stars
  for (const p of pipes) {
    const sx = p.wx - cam;
    if (sx < -PW - 20 || sx > W + 20) continue;
    drawPipe(sx, p.gapY, p.gap);
    if (p.star && !p.taken) star(sx + PW / 2, p.gapY, 13 + Math.sin(time * 6) * 1.5);
  }
  drawGround();
  drawBird(bx, by, bird.vy);

  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.7})`; ctx.fillRect(0, 0, W, H); }

  // HUD
  if (state === 'play' || state === 'dying') txt(String(score), W / 2, 62, 58, '#fff', '#26323a');
  if (state !== 'dead' && state !== 'dying') iconBtn(W - 100, 12, 40, iconPause, togglePause);
  iconBtn(W - 52, 12, 40, iconMute, toggleMute);
  if (state === 'ready' || state === 'dead') iconBtn(W - 148, 12, 40, iconTrophy, openBoard);

  // ready overlay (onboarding: visual keyboard + mouse/tap hint, 1 click to start)
  if (state === 'ready' && !paused) {
    if (!revived) txt('PUFF FLAP', W / 2, H * 0.2, 54, '#fff', '#26323a');
    const y = H * 0.66, kx = W / 2 - 87;
    ctx.save();
    ctx.translate(0, Math.sin(time * 5) * 3);
    rr(kx, y, 110, 46, 9); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#26323a'; ctx.stroke();
    rr(kx + 4, y + 4, 102, 32, 6); ctx.fillStyle = '#eef3f6'; ctx.fill();
    txt('SPACE', kx + 55, y + 21, 20, '#26323a', null, 96);
    const mx = kx + 140;
    rr(mx, y - 6, 34, 52, 17); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#26323a'; ctx.stroke();
    ctx.fillStyle = '#ff8a2a'; ctx.beginPath(); ctx.moveTo(mx + 17, y - 6); ctx.lineTo(mx + 17, y + 18);
    ctx.lineTo(mx + 3, y + 18); ctx.arcTo(mx, y + 18, mx, y + 6, 3); ctx.arc(mx + 17, y + 11, 17, Math.PI, Math.PI * 1.5); ctx.fill();
    ctx.beginPath(); ctx.moveTo(mx + 17, y - 6); ctx.lineTo(mx + 17, y + 18); ctx.strokeStyle = '#26323a'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
    txt('/', kx + 125, y + 21, 26, '#fff', '#26323a', 30);
    txt(t.tap, W / 2, y + 86, 22, '#fff', '#26323a', W - 30);
  }

  // paused overlay
  if (paused) {
    ctx.fillStyle = 'rgba(10,20,30,.5)'; ctx.fillRect(0, 0, W, H);
    txt(t.paused, W / 2, H / 2 - 20, 52, '#fff', '#26323a');
    txt(t.resume, W / 2, H / 2 + 32, 24, '#fff', '#26323a', W - 30);
  }

  // game over panel
  if (state === 'dead') {
    const a = clamp(deadT / 0.25, 0, 1);
    const canCont = sdkReady && !reviveUsed && !rewardFailed && score >= 3;
    const h = canCont ? 380 : 318, w = 300, x0 = W / 2 - w / 2, y0 = H / 2 - h / 2;
    ctx.globalAlpha = a;
    rr(x0, y0, w, h, 20); ctx.fillStyle = '#fff7e0'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = '#7a4a0a'; ctx.stroke();
    txt(t.over, W / 2, y0 + 42, 38, '#fff', '#7a4a0a', w - 30);
    txt(t.score, W / 2, y0 + 86, 20, '#7a4a0a', null, w - 30);
    txt(String(score), W / 2, y0 + 124, 46, '#fff', '#7a4a0a');
    txt(`${t.best}: ${best}`, W / 2, y0 + 164, 22, '#7a4a0a', null, w - 30);
    if (newBest) txt(t.nb, W / 2, y0 + 190, 22, '#ff8a2a', '#7a4a0a', w - 30);
    if (deadT > 0.3) {
      let by = y0 + 204;
      if (canCont) { btn(W / 2 - 115, by, 230, 52, t.cont, '#f08a1c', doContinue); by += 62; }
      btn(W / 2 - 115, by, 230, 52, t.again, '#4cae2a', restart);
      btn(W / 2 - 115, by + 58, 230, 44, t.lb, '#3a7bd5', openBoard);
    }
    ctx.globalAlpha = 1;
  }

  // leaderboard overlay sits on top and takes over all input
  if (boardOpen) { buttons.length = 0; drawBoard(); }
}

/* ------------------------------------------------------------------ *
 *  Input (keyboard layout independent: uses physical key codes,
 *  never Escape / Ctrl+W / other browser-reserved keys)
 * ------------------------------------------------------------------ */
function onPress(x, y) {
  ensureAudio();
  if (adActive) return;
  for (const b of buttons) {
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.fn(); return; }
  }
  if (boardOpen) return;
  if (paused) { resume(); return; }
  flap();
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); cv.focus();
  const r = cv.getBoundingClientRect();
  onPress((e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H);
});
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  const c = e.code;
  if (c === 'Space' || c.startsWith('Arrow')) e.preventDefault();   // stop page scrolling
  if (e.repeat) return;
  ensureAudio();
  if (c === 'KeyL') { toggleBoard(); return; }
  if (boardOpen) { if (c === 'KeyM') toggleMute(); return; }
  if (c === 'Space' || c === 'ArrowUp' || c === 'KeyW') {
    if (adActive) return;
    if (paused) { resume(); return; }
    if (state === 'dead') { if (deadT > 0.35) restart(); return; }
    flap();
  } else if (c === 'Enter') {
    if (state === 'dead' && deadT > 0.35 && !adActive) restart();
  } else if (c === 'KeyP') togglePause();
  else if (c === 'KeyM') toggleMute();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { pause(); if (actx) actx.suspend(); }
  else if (actx) actx.resume();
});
window.addEventListener('blur', pause);

/* ------------------------------------------------------------------ *
 *  Responsive canvas (sharp on any devicePixelRatio, any 16:9 iframe)
 * ------------------------------------------------------------------ */
function resize() {
  DPR = window.devicePixelRatio || 1;
  const cw = window.innerWidth, ch = window.innerHeight;
  cv.width = Math.round(cw * DPR); cv.height = Math.round(ch * DPR);
  S = ch / 600; W = cw / S; H = 600;
  if (W < 360) { S = cw / 360; W = 360; H = ch / S; }   // tall phones: extend world vertically
  groundY = H - 70;
  for (const p of pipes) {
    const [lo, hi] = pipeBounds(p.gap);
    p.base = clamp(p.base, lo, hi); p.gapY = clamp(p.gapY, lo, hi);
  }
  if (state === 'ready') hoverY = Math.min(hoverY, groundY - 80);
  if (bird.y > groundY - R) bird.y = bird.py = groundY - R;
}
window.addEventListener('resize', resize);

/* ------------------------------------------------------------------ *
 *  Main loop
 * ------------------------------------------------------------------ */
let last = 0, acc = 0;
function frame(ts) {
  const dt = Math.min(0.1, (ts - last) / 1000 || 0); last = ts;
  if (!paused && !adActive) {
    acc += dt;
    while (acc >= STEP) { update(STEP); acc -= STEP; }
  } else acc = 0;
  render(acc / STEP);
  requestAnimationFrame(frame);
}

(async () => {
  resize();
  await initSDK();
  try { if (sdkReady) SDK().game.loadingStart(); } catch (e) {}
  best = parseInt(load('best'), 10) || 0;
  muted = load('muted') === '1' || load('muted') === 1;
  try { myTop = JSON.parse(load('top') || '[]').filter(e => e && e.s > 0).sort((a, b) => b.s - a.s).slice(0, 10); } catch (e) { myTop = []; }
  reset();
  requestAnimationFrame(ts => {
    last = ts; frame(ts);
    try { if (sdkReady) SDK().game.loadingStop(); } catch (e) {}
  });
})();
})();
</script>
</body>
</html>
